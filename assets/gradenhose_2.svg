<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
     width="150" height="250" viewBox="0 0 150 250">
  <!-- Wandhaken (klein, grau) -->
  <path d="M71,3 L78,3 L78,16 L86,16 L86,21 L78,21 L78,29 L71,29 Z"
        fill="#7a7a7a" stroke="#3a3a3a" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Coil: 8 gestapelte horizontale Ovale mit leichtem Versatz und innerer Schattenkante.
       Stilisierte Seitenansicht eines aufgewickelten Schlauchs, der vom Haken hängt. -->
  <g id="coil" stroke="#1f5418" stroke-width="1.5">
    <ellipse cx="74" cy="38"  rx="58" ry="11" fill="#3e8d2c"/>
    <ellipse cx="74" cy="38"  rx="48" ry="4"  fill="#205814" stroke="none"/>

    <ellipse cx="76" cy="58"  rx="60" ry="11" fill="#3e8d2c"/>
    <ellipse cx="76" cy="58"  rx="50" ry="4"  fill="#205814" stroke="none"/>

    <ellipse cx="73" cy="78"  rx="61" ry="11" fill="#3e8d2c"/>
    <ellipse cx="73" cy="78"  rx="51" ry="4"  fill="#205814" stroke="none"/>

    <ellipse cx="75" cy="98"  rx="61" ry="11" fill="#3e8d2c"/>
    <ellipse cx="75" cy="98"  rx="51" ry="4"  fill="#205814" stroke="none"/>

    <ellipse cx="74" cy="118" rx="60" ry="11" fill="#3e8d2c"/>
    <ellipse cx="74" cy="118" rx="50" ry="4"  fill="#205814" stroke="none"/>

    <ellipse cx="76" cy="138" rx="59" ry="11" fill="#3e8d2c"/>
    <ellipse cx="76" cy="138" rx="49" ry="4"  fill="#205814" stroke="none"/>

    <ellipse cx="74" cy="158" rx="57" ry="11" fill="#3e8d2c"/>
    <ellipse cx="74" cy="158" rx="47" ry="4"  fill="#205814" stroke="none"/>

    <ellipse cx="73" cy="178" rx="54" ry="11" fill="#3e8d2c"/>
    <ellipse cx="73" cy="178" rx="44" ry="4"  fill="#205814" stroke="none"/>
  </g>

  <!-- Hängendes Schlauch-Ende, das aus dem Coil unten-rechts heraustritt und zur Düse läuft. -->
  <path d="M120,180 Q132,200 124,222 Q118,238 124,250"
        fill="none" stroke="#1f5418" stroke-width="14" stroke-linecap="round"/>
  <path d="M120,180 Q132,200 124,222 Q118,238 124,250"
        fill="none" stroke="#3e8d2c" stroke-width="10" stroke-linecap="round"/>
  <path d="M120,180 Q132,200 124,222 Q118,238 124,250"
        fill="none" stroke="#205814" stroke-width="3" stroke-linecap="round" stroke-dasharray="0,8,1,1"/>

  <!-- Düse (Spritze): Kunststoff-Hülse + Metallspitze -->
  <rect x="116" y="245" width="16" height="5" fill="#3e8d2c" stroke="#1f5418" stroke-width="1"/>
</svg>
